name: FOMO Scheduled Scan

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scanner
        run: python scanner.py

      - name: Rebuild dashboard
        run: python build_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "fomo-bot"
          git config user.email "fomo-bot@users.noreply.github.com"
          git add data/signals.json index.html dashboard.html
          git diff --staged --quiet || git commit -m "Automated scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
